site_name: EasyPlan
site_description: Self-hosted Mini-App, die Fixkosten zusammenrechnet
site_author: HeiligerG
repo_url: https://github.com/HeiligerG/EasyPlan
repo_name: HeiligerG/EasyPlan
edit_uri: ""
copyright: MIT-Lizenz, 2026 HeiligerG

theme:
  name: material
  language: de
  features:
    - content.code.copy
    - navigation.footer
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-night
        name: Zu dunkel wechseln
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Zu hell wechseln

nav:
  - Start: index.md
  - Architektur: architecture.md
  - Funktionen:
    - Berechnung: features/berechnung.md
    - Wiederholungen: features/wiederholungen.md
    - Datenspeicher: features/datenspeicher.md
  - Architekturentscheidungen:
    - Übersicht: adr/index.md
    - "ADR-0001: SQLite ohne CGO": adr/0001-sqlite-ohne-cgo.md
    - "ADR-0002: Rappen und Rundung": adr/0002-rappen-und-rundung.md
    - "ADR-0003: Kalendertage in UTC": adr/0003-kalendertage-utc.md
    - "ADR-0004: Nächste Zahlung pro Konto": adr/0004-naechste-zahlung-pro-konto.md
  - Beitragen: contributing.md
  - Changelog: changelog.md

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/HeiligerG/EasyPlan
      name: EasyPlan auf GitHub
