site_name: EasyPlan
site_description: Self-hosted Mini-App, die Fixkosten zusammenrechnet
site_author: HeiligerG
site_url: https://heiligerg.github.io/EasyPlan/
repo_url: https://github.com/HeiligerG/EasyPlan
repo_name: HeiligerG/EasyPlan
edit_uri: ""
copyright: MIT-Lizenz, 2026 HeiligerG

theme:
  name: material
  language: de
  features:
    - content.code.copy
    - navigation.footer
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-night
        name: Zu dunkel wechseln
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Zu hell wechseln

nav:
  - Start: index.md
  - Architektur: architecture.md
  - Funktionen:
    - Oberfläche: features/oberflaeche.md
    - Dashboard: features/dashboard.md
    - Einträge: features/eintraege.md
    - Timeline: features/timeline.md
    - Konten: features/konten.md
    - Formate: features/formate.md
    - Server und Betrieb: features/server.md
    - Sicherheit: features/sicherheit.md
    - Berechnung: features/berechnung.md
    - Wiederholungen: features/wiederholungen.md
    - Datenspeicher: features/datenspeicher.md
  - Betrieb:
    - Betrieb mit Docker: betrieb.md
    - Backup und Restore: backup.md
    - CI und Dependabot: ci.md
  - Architekturentscheidungen:
    - Übersicht: adr/index.md
    - "ADR-0001: SQLite ohne CGO": adr/0001-sqlite-ohne-cgo.md
    - "ADR-0002: Rappen und Rundung": adr/0002-rappen-und-rundung.md
    - "ADR-0003: Kalendertage in UTC": adr/0003-kalendertage-utc.md
    - "ADR-0004: Nächste Zahlung pro Konto": adr/0004-naechste-zahlung-pro-konto.md
    - "ADR-0005: Origin-Prüfung statt CSRF-Token": adr/0005-origin-pruefung-statt-csrf-token.md
    - "ADR-0006: Zeitraum und Monatsgruppen der Timeline": adr/0006-timeline-zeitraum-und-monatsgruppen.md
    - "ADR-0007: Backup als POST": adr/0007-backup-als-post.md
    - "ADR-0008: Bind-Default und Image-Override": adr/0008-bind-default-und-image-override.md
    - "ADR-0009: Update-Policy für Go": adr/0009-dependabot-update-policy-go.md
  - Beitragen: contributing.md
  - Changelog: changelog.md

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/HeiligerG/EasyPlan
      name: EasyPlan auf GitHub
